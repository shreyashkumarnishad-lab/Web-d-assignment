<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Assignment 3: Block and Inline Elements</title>
                <style>
                        body {
                                    font-family: "Times New Roman", Times, serif;
                                                margin: 40px;
                                                        }

                                                                .output-heading {
                                                                            color: #2e7d32;
                                                                                        font-weight: bold;
                                                                                                    margin-bottom: 5px;
                                                                                                            }

                                                                                                                    /* Outer container box */
                                                                                                                            .container {
                                                                                                                                        border: 1px solid #4CAF50;
                                                                                                                                                    padding: 15px 60px;
                                                                                                                                                                font-size: 14px;
                                                                                                                                                                        }

                                                                                                                                                                                /* Block elements */
                                                                                                                                                                                        .block-item {
                                                                                                                                                                                                    background-color: #add8e6; /* Light blue */
                                                                                                                                                                                                                margin-bottom: 5px;
                                                                                                                                                                                                                            padding: 2px 4px;
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                            /* Inline elements */
                                                                                                                                                                                                                                                    .inline-item {
                                                                                                                                                                                                                                                                background-color: #90ee90; /* Light green */
                                                                                                                                                                                                                                                                            padding: 2px 4px;
                                                                                                                                                                                                                                                                                        margin-right: 4px;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                        /* Student details below the output */
                                                                                                                                                                                                                                                                                                                .student-info {
                                                                                                                                                                                                                                                                                                                            margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                    line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                    <div class="output-heading">Output</div>

                                                                                                                                                                                                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                <div class="block-item">Block 1</div>
                                                                                                                                                                                                                                                                                                                                                                                        <div class="block-item">Block 2</div>
                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                        <span class="inline-item">Inline 1</span>
                                                                                                                                                                                                                                                                                                                                                                                                                <span class="inline-item">Inline 2</span>
                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="inline-item">Inline 3</span>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="student-info">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>NAME:</strong> SHREYASH KUMAR<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>ADMISSION NO:</strong> 2026B15410162
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
