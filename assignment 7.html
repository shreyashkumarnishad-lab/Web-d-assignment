<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Assignment 7: Navigation Menu Using Lists</title>
            <style>
                    ul {
                                list-style-type: none;
                                            margin: 0;
                                                        padding: 0;
                                                                    background-color: #333333;
                                                                                overflow: hidden;
                                                                                        }

                                                                                                li {
                                                                                                            float: left;
                                                                                                                    }

                                                                                                                            li a {
                                                                                                                                        display: block;
                                                                                                                                                    color: white;
                                                                                                                                                                text-align: center;
                                                                                                                                                                            padding: 14px 20px;
                                                                                                                                                                                        text-decoration: none;
                                                                                                                                                                                                }

                                                                                                                                                                                                        li a:hover {
                                                                                                                                                                                                                    background-color: #111111;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                    .student-info {
                                                                                                                                                                                                                                                margin-top: 20px;
                                                                                                                                                                                                                                                            font-family: Arial, sans-serif;
                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                    </head>
                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                        <!-- Horizontal Navigation Menu -->
                                                                                                                                                                                                                                                                                            <ul>
                                                                                                                                                                                                                                                                                                    <li><a href="#home">Home</a></li>
                                                                                                                                                                                                                                                                                                            <li><a href="#about">About</a></li>
                                                                                                                                                                                                                                                                                                                    <li><a href="#courses">Courses</a></li>
                                                                                                                                                                                                                                                                                                                            <li><a href="#contact">Contact</a></li>
                                                                                                                                                                                                                                                                                                                                </ul>

                                                                                                                                                                                                                                                                                                                                    <!-- Output ke niche Student Details -->
                                                                                                                                                                                                                                                                                                                                        <div class="student-info">
                                                                                                                                                                                                                                                                                                                                                <p><strong>Name:</strong> Shreyash Kumar</p>
                                                                                                                                                                                                                                                                                                                                                        <p><strong>Admission Number:</strong> 2026B15410162</p>
                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                            </html>
